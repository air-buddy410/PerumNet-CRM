# ── Produksi PerumNet CRM (Fase 57) ─────────────────────────────
#
# JANGAN HAPUS baris `name:` di bawah.
#
# Tanpa itu, Docker Compose menurunkan nama proyek dari NAMA FOLDER. Ganti nama
# foldernya — atau pindahkan seperti yang sudah pernah terjadi ke
# APP-Perumnet/ — dan Compose membuat volume BARU yang kosong. Database naik
# seolah-olah seluruh datanya lenyap.
#
# Ini bukan kekhawatiran teoretis: di mesin ini masih tersisa volume
# `prtgperumnet_perumnet-pgdata` dari zaman foldernya bernama "PRTG PerumNet".
name: perumnet-crm

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER belum diisi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD belum diisi}
      POSTGRES_DB: ${POSTGRES_DB:-perumnet}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # TIDAK dipetakan ke port host. Yang perlu menghubunginya cuma app, dan itu
    # lewat jaringan internal Compose. Membuka 5432 ke host berarti membuka
    # database ke seluruh jaringan tempat VPS itu berada.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-perumnet}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        # Menunggu database SIAP, bukan sekadar kontainernya menyala. Tanpa
        # ini app menyala lebih dulu, gagal menyambung, lalu mati berulang.
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-perumnet}
      # Seluruh kredensial datang dari berkas .env di HOST, tidak pernah
      # dipanggang ke dalam citra. Lihat .dockerignore.
      AUTH_PROVIDER: ${AUTH_PROVIDER:-MAILSERVER}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET belum diisi}
      APP_URL: ${APP_URL:-http://localhost:3300}
      MAILCOW_API_KEY: ${MAILCOW_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      IT_SUPPORT_EMAIL: ${IT_SUPPORT_EMAIL:-}
      MIKROTIK_POP1_CRED: ${MIKROTIK_POP1_CRED:-}
      # Sertifikat MikroTik bikinan sendiri. Tanpa ini sambungan ditolak
      # verifikasi TLS, dan galatnya bicara soal sertifikat — bukan soal
      # variabel yang hilang, jadi mudah salah dikejar.
      MIKROTIK_INSECURE_TLS: ${MIKROTIK_INSECURE_TLS:-}
      # Fase 87–88b. Sesi portal pelanggan memakai rahasia SENDIRI — bukan
      # SESSION_SECRET staf — dan pembacaan daya ONU meminta community SNMP
      # dari LibreNMS. Tanpa dua baris ini keduanya gagal saat DIPAKAI, bukan
      # saat menyala: login portal melempar galat begitu disubmit, dan tombol
      # baca daya menjawab "token belum terisi".
      PORTAL_SESSION_SECRET: ${PORTAL_SESSION_SECRET:-}
      # Fase 88b — kredensial telnet OLT, "user:password" per perangkat.
      # Yang tersimpan di basis data hanya NAMA variabelnya
      # (OltDevice.credentialRef); nilainya hanya di sini.
      OLT_PSG_CRED: ${OLT_PSG_CRED:-}
      OLT_KCC_CRED: ${OLT_KCC_CRED:-}
      OLT_ABG_CRED: ${OLT_ABG_CRED:-}
      OLT_SRYB_CRED: ${OLT_SRYB_CRED:-}
      OLT_SRYT_CRED: ${OLT_SRYT_CRED:-}
      LIBRENMS_API_TOKEN: ${LIBRENMS_API_TOKEN:-}
    ports:
      - "${APP_PORT:-3300}:3300"
    volumes:
      # Lampiran: foto pegawai, bukti pekerjaan, tanda tangan. Ini DATA.
      # Tanpa volume, semuanya hilang setiap kali citranya diperbarui.
      - uploads:/app/uploads

  # ── Worker penjadwal ───────────────────────────────────────────
  #
  # PROSES TERSENDIRI, bukan di dalam aplikasi web — dan itu bukan kerapian
  # melainkan pemisahan kegagalan. Polling router berfrekuensi tinggi dan boleh
  # gagal; penerbitan tagihan bersifat transaksional dan tidak boleh. Loop
  # monitoring yang macet tidak boleh menahan operasi bisnis.
  #
  # Memakai tahap `builder` karena worker-nya TypeScript dan dijalankan tsx —
  # devDependency, jadi tidak ada di citra runtime.
  #
  # Aman meski dijalankan lebih dari satu: perebutan tugas memakai kunci sewa
  # di database.
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-perumnet}
      AUTH_PROVIDER: ${AUTH_PROVIDER:-MAILSERVER}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET belum diisi}
      APP_URL: ${APP_URL:-http://localhost:3300}
      MAILCOW_API_KEY: ${MAILCOW_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      IT_SUPPORT_EMAIL: ${IT_SUPPORT_EMAIL:-}
      MIKROTIK_POP1_CRED: ${MIKROTIK_POP1_CRED:-}
      # Sertifikat MikroTik bikinan sendiri. Tanpa ini sambungan ditolak
      # verifikasi TLS, dan galatnya bicara soal sertifikat — bukan soal
      # variabel yang hilang, jadi mudah salah dikejar.
      MIKROTIK_INSECURE_TLS: ${MIKROTIK_INSECURE_TLS:-}
      # Token API LibreNMS untuk tugas `librenms.sync`. Namanya juga tersimpan
      # di Integration.credentialRef; nilainya HANYA di sini. Tanpa baris ini
      # variabel tidak pernah sampai ke dalam container — Compose memakai .env
      # untuk interpolasi, bukan untuk meneruskannya otomatis.
      LIBRENMS_API_TOKEN: ${LIBRENMS_API_TOKEN:-}
      PORTAL_SESSION_SECRET: ${PORTAL_SESSION_SECRET:-}
      # Fase 88b — kredensial telnet OLT, "user:password" per perangkat.
      # Yang tersimpan di basis data hanya NAMA variabelnya
      # (OltDevice.credentialRef); nilainya hanya di sini.
      OLT_PSG_CRED: ${OLT_PSG_CRED:-}
      OLT_KCC_CRED: ${OLT_KCC_CRED:-}
      OLT_ABG_CRED: ${OLT_ABG_CRED:-}
      OLT_SRYB_CRED: ${OLT_SRYB_CRED:-}
      OLT_SRYT_CRED: ${OLT_SRYT_CRED:-}
      WORKER_TICK_MS: ${WORKER_TICK_MS:-15000}
    volumes:
      - uploads:/app/uploads
    command: ["npx", "tsx", "scripts/worker.ts"]

  # ── Perkakas sekali jalan: siapkan skema, isi data awal ────────
  #
  # Memakai tahap `builder`, BUKAN citra runtime. Citra runtime sengaja ramping
  # — ia hanya memuat klien Prisma, bukan CLI-nya, dan tidak memuat tsx sama
  # sekali karena keduanya devDependency. Menjalankan `npx prisma` di sana
  # membuat npm mengunduh versi TERBARU dari internet, yang sudah tidak
  # mendukung bentuk skema proyek ini. Kegagalannya menyesatkan: ia bicara soal
  # `url` di schema.prisma, seolah skemanya yang salah.
  #
  # `profiles` membuatnya TIDAK ikut menyala pada `docker compose up`. Ia hanya
  # berjalan bila dipanggil: `docker compose run --rm tools <perintah>`.
  tools:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-perumnet}
      # Lingkungan yang SAMA dengan app, bukan sekadar database.
      #
      # Perkakas di sini menjalankan pekerjaan administratif yang menyentuh
      # sistem luar — mendorong tag ke mailcow, mereset password surel, mengirim
      # email. Tanpa variabel ini semuanya gagal DIAM-DIAM: mailcow terbaca
      # sebagai "nol kotak surat", lalu perintahnya melaporkan "0 didorong, 0
      # gagal" seolah memang tidak ada yang perlu dikerjakan.
      AUTH_PROVIDER: ${AUTH_PROVIDER:-MAILSERVER}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET belum diisi}
      # Fase 87–88b. Sesi portal pelanggan memakai rahasia SENDIRI — bukan
      # SESSION_SECRET staf — dan pembacaan daya ONU meminta community SNMP
      # dari LibreNMS. Tanpa dua baris ini keduanya gagal saat DIPAKAI, bukan
      # saat menyala: login portal melempar galat begitu disubmit, dan tombol
      # baca daya menjawab "token belum terisi".
      PORTAL_SESSION_SECRET: ${PORTAL_SESSION_SECRET:-}
      # Fase 88b — kredensial telnet OLT, "user:password" per perangkat.
      # Yang tersimpan di basis data hanya NAMA variabelnya
      # (OltDevice.credentialRef); nilainya hanya di sini.
      OLT_PSG_CRED: ${OLT_PSG_CRED:-}
      OLT_KCC_CRED: ${OLT_KCC_CRED:-}
      OLT_ABG_CRED: ${OLT_ABG_CRED:-}
      OLT_SRYB_CRED: ${OLT_SRYB_CRED:-}
      OLT_SRYT_CRED: ${OLT_SRYT_CRED:-}
      LIBRENMS_API_TOKEN: ${LIBRENMS_API_TOKEN:-}
      APP_URL: ${APP_URL:-http://localhost:3300}
      MAILCOW_API_KEY: ${MAILCOW_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      IT_SUPPORT_EMAIL: ${IT_SUPPORT_EMAIL:-}
      MIKROTIK_POP1_CRED: ${MIKROTIK_POP1_CRED:-}
      # Sertifikat MikroTik bikinan sendiri. Tanpa ini sambungan ditolak
      # verifikasi TLS, dan galatnya bicara soal sertifikat — bukan soal
      # variabel yang hilang, jadi mudah salah dikejar.
      MIKROTIK_INSECURE_TLS: ${MIKROTIK_INSECURE_TLS:-}
    volumes:
      - uploads:/app/uploads
    entrypoint: []
    command: ["true"]

volumes:
  pgdata:
  uploads:
